services:

  postgres:
    image: postgres:17
    container_name: tickera-postgres

    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on

    environment:
      POSTGRES_DB: tickera
      POSTGRES_USER: tickera
      POSTGRES_PASSWORD: tickera

    ports:
      - "5436:5432"

    volumes:
      - tickera_postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7.4-alpine
    container_name: tickera-redis

    ports:
      - "6380:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - tickera_redis_data:/data


  prometheus:
    image: prom/prometheus:latest
    container_name: tickera-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"


  grafana:
    image: grafana/grafana:latest
    container_name: tickera-grafana

    ports:
      - "3000:3000"

    volumes:
      - tickera_grafana_data:/var/lib/grafana


volumes:
  tickera_postgres_data:
  tickera_redis_data:
  tickera_grafana_data: