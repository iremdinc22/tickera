spring:
  application:
    name: tickera

  datasource:
    url: jdbc:postgresql://localhost:5436/tickera
    username: tickera
    password: tickera

    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  task:
    scheduling:
      pool:
        size: 2

  data:
    redis:
      host: localhost
      port: 6380
      connect-timeout: 2s
      timeout: 2s

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        enable.idempotence: true

        # send() metadata beklerken en fazla bu kadar bloklar.
        max.block.ms: 5000

        # Producer tek deneme timeout'u.
        request.timeout.ms: 5000

        # Producer'ın retry'lar dahil toplam teslim süresi.
        # Uygulama ACK bekleme süresinden (10s) büyük olmalı.
        delivery.timeout.ms: 15000

    consumer:
      group-id: tickera-booking-consumers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.iremdinc.tickera.event

server:
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

tickera:
  seat-hold:
    duration: 2m

  outbox:
    # Kafka broker acknowledgement bekleme üst sınırı.
    # Stale PROCESSING eşiği 2 dakikadır; bu değer
    # onun belirgin şekilde altında tutulmalıdır.
    publish-ack-timeout: 10s

    publish-interval-ms: 2000
    publish-initial-delay-ms: 0

    stale-recovery-interval-ms: 30000
    stale-recovery-initial-delay-ms: 0
