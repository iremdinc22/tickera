# Tickera development alert rules.
#
# Bu dosyadaki eşikler geliştirme ortamı için seçilmiş
# örnek değerlerdir; production SLA değildir.
#
# Alertmanager veya harici bildirim entegrasyonu bu
# kapsamda yoktur. Kurallar Prometheus UI üzerinde
# (/alerts) görüntülenebilir.

groups:
  - name: tickera-development

    rules:
      - alert: TickeraTargetDown

        expr: up{job="tickera"} == 0

        for: 1m

        labels:
          severity: critical
          environment: development

        annotations:
          summary: "Tickera application target is down"
          description: >-
            Prometheus has not been able to scrape
            the Tickera Actuator endpoint for more
            than 1 minute.

      - alert: TickeraOutboxFailedEvents

        expr: sum(tickera_outbox_failed_events{job="tickera"}) > 0

        for: 1m

        labels:
          severity: warning
          environment: development

        annotations:
          summary: "Tickera has failed outbox events"
          description: >-
            At least one outbox event is in FAILED
            state. Inspect the outbox_events table
            and the application logs.

      - alert: TickeraOutboxBacklog

        expr: sum(tickera_outbox_pending_events{job="tickera"}) > 50

        for: 5m

        labels:
          severity: warning
          environment: development

        annotations:
          summary: "Tickera outbox backlog is sustained"
          description: >-
            More than 50 outbox events have been
            PENDING for at least 5 minutes. Check
            Kafka availability and outbox retries.

      - alert: TickeraHttp5xxRateHigh

        expr: >-
          (
            sum(
              rate(
                http_server_requests_seconds_count{
                  job="tickera",
                  status=~"5..",
                  uri!~"/actuator.*"
                }[5m]
              )
            )
            /
            clamp_min(
              sum(
                rate(
                  http_server_requests_seconds_count{
                    job="tickera",
                    uri!~"/actuator.*"
                  }[5m]
                )
              ),
              0.001
            )
          )
          > 0.05

        for: 5m

        labels:
          severity: warning
          environment: development

        annotations:
          summary: "Tickera HTTP 5xx rate is elevated"
          description: >-
            More than 5% of non-Actuator HTTP
            responses have been 5xx for at least
            5 minutes.
